    <style>
        @media print {
            @page { 
                margin: 5mm; 
                size: auto; /* Deixa o navegador decidir, mas com margens pequenas */
            }
            body { 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact;
                zoom: 0.55; /* Reduz a escala para 55% para caber mais itens por folha A4 */
            }
            /* Garante que cores de fundo (azul/verde/vermelho) apareçam na impressão */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            /* Remove sombras e bordas extras na impressão */
            .shadow-sm, .shadow-md, .shadow-xl {
                box-shadow: none !important;
            }
            /* Evita quebra de tabela no meio da linha */
            tr {
                break-inside: avoid;
            }
            /* Esconde elementos de interface na impressão */
            .no-print {
                display: none !important;
            }
        }
    </style>

        } from 'https://esm.sh/recharts@2.10.3?deps=react@18.2.0,react-dom@18.2.0&bundle';

        window.React = React;
        Object.assign(window, { useState, useEffect, useRef, useMemo, useCallback });
        
        window.ReactDOM = ReactDOM;
        
        Object.assign(window, {

            LogIn, LogOut, Save, RefreshCw, Upload, FileDown, Printer, User, Plus, TrendingUp, List, X, Package, Trash2, Utensils, Edit2, Check, Grid, GripVertical, Filter,

            PieChart, Pie, Cell, Tooltip, Legend, BarChart, Bar, XAxis, YAxis, CartesianGrid, ResponsiveContainer, LineChart, Line, LabelList
        });

        // Sinaliza que React e deps estão prontos
        window.dispatchEvent(new Event('deps-ready'));

                "Quick Cone", "Quick Chocobarra", "Quick Uka", "Quick Uva", "Quick Limão", "Quick Sundae", 
                "Quick Castanha de Pará", "Quick Castanha de Caju", "Açaí com Leite", "Quick Açaí Guaraná", 
                "Ninho Trufado", "Tapioca", "Groselha"
            ],
            jarras_tacas: [
                "Copo Nadir", "Copo Longo", "Taça Cristal", "Copo Whisky", "Taça Martini", "Taça Coquetel", 
                "Taça Piscina", "Copo Americano", "Copo Caipirinha", "Taça Vinho", "Taça Espumante", 
                "Jarra Grande", "Jarra Média"
            ]
        };

        // --- FUNÇÃO PARA GERAR DADOS VAZIOS ---
        const generateCompleteDataSet = (master, values = {}, responsavel = "", unidade = "-", catalog = {}) => {
            const dataset = { responsavel, unidade };
            
            ['aguas', 'cervejas', 'zero_energeticos', 'refrigerantes', 'sucos'].forEach(cat => {
                dataset[cat] = master[cat].map(itemName => {
                    const vals = values[cat]?.[itemName] || {};
                    return { 
                        nome: itemName, 
                        l1: vals.l1 || 0, 
                        l2: vals.l2 || 0, 
                        l3: vals.l3 || 0, 
                        l4: vals.l4 || 0,
                        unitValue: catalog[itemName]?.unitValues?.[unidade] || catalog[itemName]?.unitValue || 0,
                        code: catalog[itemName]?.code || ""
                    };
                });
            });

            ['sobremesas', 'destilados', 'picoles', 'jarras_tacas'].forEach(cat => {
                if (!master[cat]) return;
                dataset[cat] = master[cat].map(itemName => {
                    const qtd = values[cat]?.[itemName] || 0;
                    return { 
                        nome: itemName, 
                        qtd,
                        unitValue: catalog[itemName]?.unitValues?.[unidade] || catalog[itemName]?.unitValue || 0,
                        code: catalog[itemName]?.code || ""
                    };
                });
            });

            return dataset;
        };

        // --- HELPER DE DATAS ---
        const getDatesForLocation = (location, dataSets) => {
            const locMap = { 'Matriz': 'matriz', 'Mucambo': 'mucambo', 'Tianguá': 'tiangua', 'Frecheirinha': 'frecheirinha' };
            const prefix = locMap[location];
            if (!prefix) return [];
            
            // Pega as chaves, extrai a data, remove duplicatas (ignora sufixo _diaria)
            const keys = Object.keys(dataSets).filter(k => k.startsWith(prefix));
            const datesSet = new Set();
            keys.forEach(k => {
                // Remove prefix, then remove _diaria suffix if present
                let datePart = k.replace(prefix + '_', '');
                if (datePart.endsWith('_diaria')) datePart = datePart.slice(0, -7);
                datesSet.add(datePart.replace('_', '/'));
            });
            
            return Array.from(datesSet).sort((a, b) => {
                const [d1, m1] = a.split('/').map(Number);
                const [d2, m2] = b.split('/').map(Number);
                return new Date(new Date().getFullYear(), m1-1, d1) - new Date(new Date().getFullYear(), m2-1, d2);
            });
        };

        const getDatasetKey = (loc, date, countType = 'semanal') => {
            const locMap = { 'Matriz': 'matriz', 'Mucambo': 'mucambo', 'Tianguá': 'tiangua', 'Frecheirinha': 'frecheirinha' };
            const dateStr = date.replace('/', '_');
            const suffix = countType === 'diaria' ? '_diaria' : '';
            return `${locMap[loc]}_${dateStr}${suffix}`;
        };

        // --- COMPONENTES ---

        const Section = ({ title, data, category, onUpdate, type = "grid", isEditing = false, catalog = {}, selectedLocation, isPrintSheetMode = false }) => {
            const [sortConfig, setSortConfig] = window.React.useState({ key: 'nome', direction: 'asc' });
            
            const filteredData = React.useMemo(() => {
                if (!data) return [];
                return data.filter(item => {
                    const isActive = catalog[item.nome]?.active !== false;
                    const total = type === "grid" ? ((parseInt(item.l1)||0) + (parseInt(item.l2)||0) + (parseInt(item.l3)||0) + (parseInt(item.l4)||0)) : (parseInt(item.qtd)||0);
                    return isActive || total > 0;
                });
            }, [data, catalog, type]);

            if (filteredData.length === 0) return null;

            const handleSort = (key) => {
                if (sortConfig.key === key) {
                    if (sortConfig.direction === 'asc') setSortConfig({ key, direction: 'desc' });
                    else setSortConfig({ key: 'nome', direction: 'asc' });
                } else {
                    setSortConfig({ key, direction: 'asc' });
                }
            };

            const sortedData = [...data].sort((a, b) => {
                if (sortConfig.key === 'code') {
                    const aVal = catalog[a.nome] ? (parseInt(catalog[a.nome].code) || 0) : 0;
                    const bVal = catalog[b.nome] ? (parseInt(catalog[b.nome].code) || 0) : 0;
                    return sortConfig.direction === 'asc' ? aVal - bVal : bVal - aVal;
                } else {
                    return sortConfig.direction === 'asc' ? a.nome.localeCompare(b.nome) : b.nome.localeCompare(a.nome);
                }
            });

            return (
                <div className={`mb-8 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden print:mb-2 print:border-gray-400 ${!isPrintSheetMode ? 'break-inside-avoid' : ''}`}>
                    {!isPrintSheetMode && (
                        <div className="bg-white px-6 py-4 print:py-3 print:px-4">
                            <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2 print:text-lg">
                                <span className="w-2 h-6 bg-[#00a86b] rounded-sm mr-1"></span>
                                {title}
                                <span className="text-xs font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full print:hidden">
                                    {data.length} itens
                                </span>
                            </h3>
                        </div>
                    )}
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left border-t border-slate-100">
                            <thead className="text-[10px] lg:text-xs text-white uppercase bg-[#003d33]">
                                {isPrintSheetMode && (
                                    <tr>
                                        <th colSpan="10" className="px-2 py-1 text-center text-sm bg-gray-200 text-gray-800 border-b border-black font-bold tracking-widest print:bg-gray-200 print:text-black">
                                            {title}
                                        </th>
                                    </tr>
                                )}
                                {type === "grid" ? (
                                    <tr>
                                        <th onClick={() => handleSort('code')} className={`px-2 py-3 lg:px-4 w-12 lg:w-16 text-center font-semibold tracking-wide cursor-pointer hover:bg-black/10 transition-colors print:px-1 print:py-1 ${isPrintSheetMode ? 'print:border-black border border-slate-300' : ''}`}>Cód. {sortConfig.key === 'code' ? (sortConfig.direction === 'asc' ? '↑' : '↓') : ''}</th>
                                        <th onClick={() => handleSort('nome')} className={`px-3 py-3 lg:px-6 w-1/4 font-semibold tracking-wide cursor-pointer hover:bg-black/10 transition-colors print:px-2 print:py-2 whitespace-nowrap ${isPrintSheetMode ? 'print:border-black border border-slate-300' : ''}`}>Produto {sortConfig.key === 'nome' ? (sortConfig.direction === 'asc' ? '↑' : '↓') : ''}</th>
                                        <th className={`px-2 py-3 text-center font-semibold tracking-wide border-white/10 print:bg-transparent print:px-1 print:py-2 ${isPrintSheetMode ? 'print:border-black border border-slate-300' : 'border-r'}`}>Loc 1</th>
                                        <th className={`px-2 py-3 text-center font-semibold tracking-wide border-white/10 print:bg-transparent print:px-1 print:py-2 ${isPrintSheetMode ? 'print:border-black border border-slate-300' : 'border-r'}`}>Loc 2</th>
                                        <th className={`px-2 py-3 text-center font-semibold tracking-wide border-white/10 print:bg-transparent print:px-1 print:py-2 ${isPrintSheetMode ? 'print:border-black border border-slate-300' : 'border-r'}`}>Loc 3</th>
                                        <th className={`px-2 py-3 text-center font-semibold tracking-wide print:bg-transparent print:px-1 print:py-2 ${isPrintSheetMode ? 'print:border-black border border-slate-300' : ''}`}>Loc 4</th>
                                        {!isPrintSheetMode && (
                                            <>
                                                <th className="px-3 py-3 lg:px-6 text-center font-bold bg-black/20 print:bg-transparent print:px-2 print:py-1">Total</th>
                                                <th className="px-2 py-3 lg:px-4 text-center font-semibold tracking-wide print:bg-transparent print:px-1 print:py-1 whitespace-nowrap">Valor Unit.</th>
                                                <th className="px-2 py-3 lg:px-4 text-center font-bold bg-black/20 print:bg-transparent print:px-1 print:py-1 whitespace-nowrap">Valor Total</th>
                                            </>
                                        )}
                                    </tr>
                                ) : (
                                    <tr>
                                        <th onClick={() => handleSort('code')} className={`px-2 py-3 lg:px-4 w-12 lg:w-16 text-center font-semibold tracking-wide cursor-pointer hover:bg-black/10 transition-colors print:px-1 print:py-1 ${isPrintSheetMode ? 'print:border-black border border-slate-300' : ''}`}>Cód. {sortConfig.key === 'code' ? (sortConfig.direction === 'asc' ? '↑' : '↓') : ''}</th>
                                        <th onClick={() => handleSort('nome')} className={`px-3 py-3 lg:px-6 w-1/2 font-semibold tracking-wide cursor-pointer hover:bg-black/10 transition-colors print:px-2 print:py-1 whitespace-nowrap ${isPrintSheetMode ? 'print:border-black border border-slate-300' : ''}`}>Produto {sortConfig.key === 'nome' ? (sortConfig.direction === 'asc' ? '↑' : '↓') : ''}</th>
                                        <th className={`px-3 py-3 lg:px-6 text-center w-1/4 font-bold bg-black/20 print:bg-transparent print:px-2 print:py-2 ${isPrintSheetMode ? 'print:border-black border border-slate-300' : ''}`}>Quantidade</th>
                                        {!isPrintSheetMode && (
                                            <>
                                                <th className="px-2 py-3 lg:px-4 text-center font-semibold tracking-wide print:bg-transparent print:px-1 print:py-1 whitespace-nowrap">Valor Unit.</th>
                                                <th className="px-2 py-3 lg:px-4 text-center font-bold bg-black/20 print:bg-transparent print:px-1 print:py-1 whitespace-nowrap">Valor Total</th>
                                            </>
                                        )}
                                    </tr>
                                )}
                            </thead>
                            <tbody className={`divide-y divide-slate-100 ${isPrintSheetMode ? 'print:text-base print:divide-black' : 'print:text-xs'}`}>
                                {sortedData.map((item) => {
                                    const total = type === "grid" 
                                        ? (parseInt(item.l1 || 0) + parseInt(item.l2 || 0) + parseInt(item.l3 || 0) + parseInt(item.l4 || 0))
                                        : item.qtd;
                                    const isZero = total === 0;
                                    const displayCode = catalog[item.nome]?.code || item.code || '-';
                                    const unitValue = catalog[item.nome]?.unitValues?.[selectedLocation] || 0;
                                    return (
                                        <tr key={item.nome} className={`transition-colors ${isZero && !isPrintSheetMode ? 'bg-white opacity-60 hover:opacity-100 print:opacity-50' : 'bg-white hover:bg-gray-50'}`}>
                                            <td className={`px-4 py-3 text-center text-gray-400 text-xs font-bold print:p-1 ${isPrintSheetMode ? 'border border-slate-300 print:border-black' : ''}`}>{displayCode}</td>
                                            <td className={`px-6 py-3 font-medium text-gray-900 uppercase print:px-2 print:py-2 ${isPrintSheetMode ? 'border border-slate-300 print:border-black' : ''}`}>{item.nome}</td>
                                            {type === "grid" ? (
                                                <>
                                                    {['l1', 'l2', 'l3', 'l4'].map(local => (
                                                        <td key={local} className={`px-2 py-2 text-center print:p-1 ${isPrintSheetMode ? 'border border-slate-300 print:border-black' : ''}`}>
                                                            {!isPrintSheetMode && (
                                                                <input type="number" min="0" placeholder="0" disabled={!isEditing} className={`w-16 text-center rounded-md shadow-sm sm:text-sm print:border-none print:w-full print:h-full print:text-xs ${item[local] > 0 ? 'font-bold text-gray-900' : 'text-gray-400'} ${isEditing ? 'border-gray-300 focus:ring-blue-500 focus:border-blue-500 bg-transparent hover:bg-white' : 'border-transparent bg-transparent cursor-default'}`} value={item[local] || ''} onChange={(e) => onUpdate(category, item.nome, local, e.target.value)} />
                                                            )}
                                                        </td>
                                                    ))}
                                                    {!isPrintSheetMode && (
                                                        <>
                                                            <td className={`px-6 py-3 text-center font-bold bg-gray-50 print:bg-transparent print:px-2 print:py-1 ${isZero ? 'text-gray-400' : 'text-blue-600'}`}>{total.toLocaleString('pt-BR')}</td>
                                                            <td className="px-4 py-3 text-center text-gray-500">R$ {unitValue.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                            <td className={`px-4 py-3 text-center font-bold bg-gray-50 ${isZero ? 'text-gray-400' : 'text-slate-700'}`}>R$ {(total * unitValue).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                        </>
                                                    )}
                                                </>
                                            ) : (
                                                <>
                                                    <td className={`px-6 py-3 text-center print:px-2 print:py-1 ${isPrintSheetMode ? 'border border-slate-300 print:border-black min-w-[120px]' : ''}`}>
                                                        {!isPrintSheetMode && (
                                                            <input type="number" min="0" placeholder="0" disabled={!isEditing} className={`w-24 text-center rounded-md shadow-sm sm:text-sm print:border-none print:w-auto print:text-xs ${item.qtd > 0 ? 'text-blue-600 font-bold' : 'text-gray-400 font-bold'} ${isEditing ? 'border-gray-300 focus:ring-blue-500 focus:border-blue-500 bg-gray-50' : 'border-transparent bg-transparent cursor-default'}`} value={item.qtd || ''} onChange={(e) => onUpdate(category, item.nome, 'qtd', e.target.value)} />
                                                        )}
                                                    </td>
                                                    {!isPrintSheetMode && (
                                                        <>
                                                            <td className="px-4 py-3 text-center text-gray-500">R$ {unitValue.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                            <td className={`px-4 py-3 text-center font-bold bg-gray-50 ${isZero ? 'text-gray-400' : 'text-slate-700'}`}>R$ {(total * unitValue).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                        </>
                                                    )}
                                                </>
                                            )}
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const ControlSection = ({ title, data, category, stockFlowData, previousStockData, previousDateMap, onFlowUpdate, previousDateLabel, catalog = {}, type = "grid", isEditing = false, selectedLocation, currentDate, hideZeroProducts = false, printMode = 'full' }) => {
            const [sortConfig, setSortConfig] = window.React.useState({ key: 'nome', direction: 'asc' });
            
            const filteredData = React.useMemo(() => {
                if (!data) return [];
                return data.filter(item => {
                    const isActive = catalog[item.nome]?.active !== false;
                    const countedTotal = type === "grid" ? ((parseInt(item.l1)||0) + (parseInt(item.l2)||0) + (parseInt(item.l3)||0) + (parseInt(item.l4)||0)) : (parseInt(item.qtd)||0);
                    const flow = stockFlowData?.[item.nome] || { entry: 0, exit: 0 };
                    const prevStock = previousStockData?.[item.nome] || 0;
                    const expected = (prevStock + (parseInt(flow.entry)||0)) - (parseInt(flow.exit)||0);
                    const divergence = countedTotal - expected;
                    
                    if (printMode === 'divergences' && divergence === 0) return false;
                    
                    if (hideZeroProducts) {
                        if (prevStock === 0 && expected === 0 && countedTotal === 0) return false;
                    }

                    const hasData = countedTotal > 0 || prevStock > 0 || flow.entry > 0 || flow.exit > 0;
                    return isActive || hasData;
                });
            }, [data, catalog, type, stockFlowData, previousStockData, hideZeroProducts, printMode]);

            if (filteredData.length === 0) return null;

            const handleSort = (key) => {
                if (sortConfig.key === key) {
                    if (sortConfig.direction === 'asc') setSortConfig({ key, direction: 'desc' });
                    else setSortConfig({ key: 'nome', direction: 'asc' });
                } else {
                    setSortConfig({ key, direction: 'asc' });
                }
            };

            const sortedData = [...filteredData].sort((a, b) => {
                if (sortConfig.key === 'code') {
                    const aVal = catalog[a.nome] ? (parseInt(catalog[a.nome].code) || 0) : 0;
                    const bVal = catalog[b.nome] ? (parseInt(catalog[b.nome].code) || 0) : 0;
                    return sortConfig.direction === 'asc' ? aVal - bVal : bVal - aVal;
                } else {
                    return sortConfig.direction === 'asc' ? a.nome.localeCompare(b.nome) : b.nome.localeCompare(a.nome);
                }
            });

            return (
                <div className="mb-8 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden print:mb-2 print:border-gray-300">
                    <div className="bg-white px-6 py-4 print:hidden">
                        <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <span className="w-2 h-6 bg-[#00a86b] rounded-sm mr-1"></span>
                            {title}
                            <span className="text-xs font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full">Controle & Divergência</span>
                        </h3>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left border-t border-slate-100">
                            <thead className="text-[10px] xl:text-xs text-white uppercase bg-[#003d33]">
                                <tr className="hidden print:table-row bg-white text-slate-800 border-b-2 border-black">
                                    <th colSpan="11" className="text-left font-bold py-2 px-1 text-sm uppercase">
                                        <span className="inline-block w-1.5 h-4 bg-[#00a86b] rounded-sm mr-1 align-middle"></span>
                                        {title}
                                    </th>
                                </tr>
                                <tr>
                                    <th onClick={() => handleSort('code')} className="px-1 py-3 lg:px-2 w-10 lg:w-16 text-center font-semibold tracking-wide cursor-pointer hover:bg-black/10 transition-colors print:px-1 print:py-1">Cód. {sortConfig.key === 'code' ? (sortConfig.direction === 'asc' ? '↑' : '↓') : ''}</th>
                                    <th onClick={() => handleSort('nome')} className="px-2 py-3 lg:px-4 font-semibold tracking-wide cursor-pointer hover:bg-black/10 transition-colors print:px-2 print:py-1 whitespace-nowrap">Produto {sortConfig.key === 'nome' ? (sortConfig.direction === 'asc' ? '↑' : '↓') : ''}</th>
                                    <th className="px-1 py-3 lg:px-2 text-center font-semibold tracking-wide border-r border-white/10 print:bg-transparent print:px-1 print:py-1 whitespace-nowrap">Ant. {previousDateLabel && <span className="block text-[9px] text-white/70 font-normal">({previousDateLabel})</span>}</th>
                                    <th className="px-1 py-3 lg:px-2 text-center font-semibold tracking-wide border-r border-white/10 print:bg-transparent print:px-1 print:py-1 whitespace-nowrap">Ent. (+)</th>
                                    <th className="px-1 py-3 lg:px-2 text-center font-semibold tracking-wide border-r border-white/10 print:bg-transparent print:px-1 print:py-1 whitespace-nowrap">Saí. (-)</th>
                                    <th className="px-1 py-3 lg:px-2 text-center font-semibold tracking-wide bg-black/20 print:bg-transparent print:px-1 print:py-1 whitespace-nowrap">Teór. (=)</th>
                                    <th className="px-1 py-3 lg:px-2 text-center font-bold tracking-wide border-l border-white/10 print:bg-transparent print:px-1 print:py-1 whitespace-nowrap">Contagem<br/>{currentDate && <span className="block text-[9px] text-white/70 font-normal">({currentDate})</span>}</th>
                                    <th className="px-1 py-3 lg:px-2 text-center font-bold tracking-wide print:px-1 print:py-1 whitespace-nowrap">Divergência</th>
                                    <th className="px-1 py-3 lg:px-2 text-center font-semibold tracking-wide print:bg-transparent print:px-1 print:py-1 whitespace-nowrap">V. Unit</th>
                                    <th className="px-1 py-3 lg:px-2 text-center font-bold bg-black/20 print:bg-transparent print:px-1 print:py-1 whitespace-nowrap leading-tight">Valor Total<br/><span className="text-[9px] font-normal opacity-80">(Contagem)</span></th>
                                    <th className="px-1 py-3 lg:px-2 text-center font-bold bg-black/20 border-l border-white/10 print:bg-transparent print:px-1 print:py-1 whitespace-nowrap leading-tight">Valor Total<br/><span className="text-[9px] font-normal opacity-80">(Divergência)</span></th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 print:text-xs">
                                {sortedData.map((item) => {
                                    const countedTotal = type === "grid" ? (parseInt(item.l1 || 0) + parseInt(item.l2 || 0) + parseInt(item.l3 || 0) + parseInt(item.l4 || 0)) : item.qtd;
                                    const flow = stockFlowData?.[item.nome] || { entry: 0, exit: 0 };
                                    const prevStock = previousStockData?.[item.nome] || 0;
                                    const expected = (prevStock + (flow.entry || 0)) - (flow.exit || 0);
                                    const divergence = countedTotal - expected;
                                    const divColor = divergence < 0 ? "text-red-600 font-bold bg-red-50 print:bg-transparent" : divergence > 0 ? "text-blue-600 font-bold bg-blue-50 print:bg-transparent" : "text-gray-400";
                                    const displayCode = catalog[item.nome]?.code || item.code || '-';
                                    const unitValue = catalog[item.nome]?.unitValues?.[selectedLocation] || 0;

                                    return (
                                        <tr key={item.nome} className="hover:bg-gray-50 transition-colors">
                                            <td className="px-4 py-3 text-center text-gray-400 text-xs font-bold print:p-0">{displayCode}</td>
                                            <td className="px-6 py-3 font-medium text-gray-900 uppercase print:px-2 print:py-1">{item.nome}</td>
                                            <td className="px-4 py-3 text-center text-gray-600 bg-gray-50 border-r border-gray-100 print:bg-transparent print:px-1 print:py-1">
                                                {prevStock}
                                                {previousDateMap?.[item.nome] && (
                                                    <div className="mt-1 flex justify-center">
                                                        <span className={`inline-block px-1.5 py-0.5 rounded border text-[9px] font-bold leading-tight print:border-none print:bg-transparent print:p-0 print:text-gray-400 ${previousDateMap[item.nome].includes('(D)') ? 'text-blue-600 bg-blue-50 border-blue-200' : 'text-purple-600 bg-purple-50 border-purple-200'}`}>
                                                            {previousDateMap[item.nome].replace(' (D)', ' Diária').replace(' (S)', ' Semanal')}
                                                        </span>
                                                    </div>
                                                )}
                                            </td>
                                            <td className="px-2 py-2 text-center bg-blue-50/30 print:bg-transparent print:p-0"><input type="number" min="0" placeholder="0" disabled={!isEditing} className={`w-20 text-center rounded-md shadow-sm sm:text-sm print:border-none print:w-full print:h-full print:text-xs ${isEditing ? 'border-gray-300 focus:ring-blue-500 focus:border-blue-500 bg-white' : 'border-transparent bg-transparent cursor-default font-bold'}`} value={flow.entry || ''} onChange={(e) => onFlowUpdate(category, item.nome, 'entry', e.target.value)} /></td>
                                            <td className="px-2 py-2 text-center bg-red-50/30 print:bg-transparent print:p-0"><input type="number" min="0" placeholder="0" disabled={!isEditing} className={`w-20 text-center rounded-md shadow-sm sm:text-sm print:border-none print:w-full print:h-full print:text-xs ${isEditing ? 'border-gray-300 focus:ring-red-500 focus:border-red-500 bg-white' : 'border-transparent bg-transparent cursor-default font-bold'}`} value={flow.exit || ''} onChange={(e) => onFlowUpdate(category, item.nome, 'exit', e.target.value)} /></td>
                                            <td className="px-4 py-3 text-center font-bold text-gray-500 bg-gray-50 print:bg-transparent print:px-1 print:py-1">{expected.toLocaleString('pt-BR')}</td>
                                            <td className="px-4 py-3 text-center font-bold text-blue-600 bg-gray-100 border-l border-r border-gray-200 print:bg-transparent print:px-1 print:py-1">{countedTotal.toLocaleString('pt-BR')}</td>
                                            <td className={`px-4 py-3 text-center print:px-1 print:py-1 ${divColor}`}>{divergence > 0 ? `+${divergence.toLocaleString('pt-BR')}` : divergence.toLocaleString('pt-BR')}</td>
                                            <td className="px-4 py-3 text-center text-gray-500">R$ {unitValue.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                            <td className={`px-4 py-3 text-center font-bold bg-gray-50 ${countedTotal === 0 ? 'text-gray-400' : 'text-slate-700'}`}>R$ {(countedTotal * unitValue).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                            <td className={`px-4 py-3 text-center font-bold bg-gray-50 border-l border-gray-100 ${divergence !== 0 ? divColor : 'text-gray-400'}`}>{divergence !== 0 ? (divergence > 0 ? '+ ' : '- ') : ''}R$ {Math.abs(divergence * unitValue).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                            <tfoot className="bg-slate-50 border-t-2 border-slate-200 text-xs font-bold text-slate-800 uppercase print:text-[10px]">
                                {(() => {
                                    let totalCounted = 0;
                                    let totalDivergence = 0;
                                    let totalValueCounted = 0;
                                    let totalValueDiv = 0;

                                    sortedData.forEach((item) => {
                                        const countedTotal = type === "grid" ? (parseInt(item.l1 || 0) + parseInt(item.l2 || 0) + parseInt(item.l3 || 0) + parseInt(item.l4 || 0)) : item.qtd;
                                        const flow = stockFlowData?.[item.nome] || { entry: 0, exit: 0 };
                                        const prevStock = previousStockData?.[item.nome] || 0;
                                        const expected = (prevStock + (flow.entry || 0)) - (flow.exit || 0);
                                        const divergence = countedTotal - expected;
                                        const unitValue = catalog[item.nome]?.unitValues?.[selectedLocation] || 0;

                                        totalCounted += countedTotal;
                                        totalDivergence += divergence;
                                        totalValueCounted += (countedTotal * unitValue);
                                        totalValueDiv += (divergence * unitValue);
                                    });

                                    return (
                                        <tr>
                                            <td colSpan="6" className="px-4 py-4 text-right">Total da Categoria:</td>
                                            <td className="px-4 py-4 text-center text-blue-700">{totalCounted.toLocaleString('pt-BR')}</td>
                                            <td className={`px-4 py-4 text-center ${totalDivergence > 0 ? 'text-blue-700' : totalDivergence < 0 ? 'text-red-700' : 'text-slate-500'}`}>{totalDivergence > 0 ? `+${totalDivergence.toLocaleString('pt-BR')}` : totalDivergence.toLocaleString('pt-BR')}</td>
                                            <td className="px-4 py-4 text-center text-slate-400">-</td>
                                            <td className="px-4 py-4 text-center text-slate-800">R$ {totalValueCounted.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                            <td className={`px-4 py-4 text-center ${totalValueDiv > 0 ? 'text-blue-700' : totalValueDiv < 0 ? 'text-red-700' : 'text-slate-500'}`}>{totalValueDiv !== 0 ? (totalValueDiv > 0 ? '+ ' : '- ') : ''}R$ {Math.abs(totalValueDiv).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                        </tr>
                                    );
                                })()}
                            </tfoot>
                        </table>
                    </div>
                </div>
            );
        };


        window.MASTER_LIST = MASTER_LIST;
        window.generateCompleteDataSet = generateCompleteDataSet;
        window.getDatesForLocation = getDatesForLocation;
        window.getDatasetKey = getDatasetKey;
        window.Section = Section;
        window.ControlSection = ControlSection;
    </script>

    <!-- LOAD COMPONENTS SEQUENTIALLY -->
    <script type="text/babel" src="components/LoginModal.js"></script>
    <script type="text/babel" src="components/CreateCountModal.js"></script>
    <script type="text/babel" src="components/Buttons.js"></script>
    <script type="text/babel" src="components/AnalyzedProductsModal.js"></script>
    <script type="text/babel" src="components/EvolutionReport.js"></script>
    <script type="text/babel" src="components/ProductCatalog.js"></script>
    <script type="text/babel" src="components/CategoryManager.js"></script>
    <script type="text/babel" src="components/ErrorBoundary.js"></script>
    <script type="text/babel" src="components/InventoryIntelligence.js"></script>
    <script type="text/babel" src="components/App.js"></script>

    <script type="text/babel">
        const renderApp = () => {
            if (!window.ReactDOM || !window.ReactDOM.createRoot) {
                // ReactDOM not yet ready, wait for deps-ready event
                window.addEventListener('deps-ready', renderApp, { once: true });
                return;
            }
            const root = window.ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        };

        // Fire when both Firebase and deps are ready
        if (window.auth && window.ReactDOM && window.ReactDOM.createRoot) {
            renderApp();
        } else if (window.auth) {
            window.addEventListener('deps-ready', renderApp, { once: true });
        } else {
            window.addEventListener('firebase-ready', () => {
                if (window.ReactDOM && window.ReactDOM.createRoot) renderApp();
                else window.addEventListener('deps-ready', renderApp, { once: true });
            }, { once: true });
        }
    </script>
</body>
</html>
